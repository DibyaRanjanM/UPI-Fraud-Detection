global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/prometheus'

  - job_name: 'ml-service'
    static_configs:
      - targets: ['host.docker.internal:8002']

  - job_name: 'gateway-simulator'
    static_configs:
      - targets: ['host.docker.internal:8001']